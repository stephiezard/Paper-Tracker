name: daily-radar

on:
  schedule:
    - cron: "0 4 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run daily fetch and score
        run: python fetch_and_score.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Commit results
        run: |
          git config user.name "research-radar-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/today.json
          git commit -m "daily update $(date +%F)" || echo "no changes to commit"
          git push
